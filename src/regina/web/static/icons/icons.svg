<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ikonový sprite pro REGINU.

  Vlastní, self-hostovaná sada ikon. Rozhraní se musí vykreslit i bez
  připojení k internetu (R13.9), takže v aplikaci nezůstává žádný odkaz na
  CDN (dřívější prototyp tahal Lucide z unpkg.com). Ikony jsou vektorové
  symboly z knihovny Lucide (licence ISC), vloné do jediného souboru
  a servírované z /static/icons/icons.svg.

  Použití v šabloně:

    <svg class="icon" width="20" height="20" aria-hidden="true">
      <use href="/static/icons/icons.svg#registr"></use>
    </svg>

  Každý symbol má viewBox 0 0 24 24 a dědí barvu přes `currentColor`
  (stroke). Šablona nastaví velikost a barvu; symbol se nemění.

  Dostupné symboly (id → účel v rozhraní):
    moje-aplikace   navigace „Moje aplikace" (mřížka karet)
    registr         navigace „Registr" (tabulka)
    uzivatele       navigace „Uživatelé"
    audit           navigace „Auditní logy"
    nova-aplikace   primární akce „Nová aplikace" (plus)
    hledat          vyhledávací pole
    menu            hamburger pro sbalený sidebar
    odhlasit        odhlášení
    detail          odkaz na detail záznamu
    upravit         akce „Upravit"
    prepsat         akce „Přepsat klasifikaci"
    vyradit         akce „Vyřadit"
    export          akce „Exportovat CSV"
    chevron-left    stránkování „Předchozí"
    chevron-right   stránkování „Další"
    chevron-down    rozbalení filtru / select
    zpet            drobenka / odkaz zpět
    zamek           indikátor „Pouze pro čtení"
    prazdny-stav    ilustrace prázdného stavu
    zavrit          zavření (např. hlášení)
    hotovo          potvrzení akce (toast success)
    varovani        chybové hlášení (toast error / 404 / 403)
    info            informační hlášení
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <defs>
