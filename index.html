<!DOCTYPE html>
<html lang="cs">

  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* === CSS CUSTOM PROPERTIES === */
    :root {
      --hc-red: #E11931;
      --hc-red-dark: #D31027;
      --hc-yellow: #FFDC50;
      --hc-yellow-light: #FFDF43;
      --color-black: #000000;
      --color-dark: #282828;
      --color-gray: #555555;
      --color-gray-light: #656565;
      --color-bg-light: #F1F4F5;
      --color-bg-warm: #F6F6F6;
      --color-border: #E4E4E4;
      --color-border-input: #D1D1D1;
      --color-white: #FFFFFF;
      --color-teal: #2DB1D3;
      --color-navy: #27455C;
      --color-blue: #002C5A;
      --color-warm-bg: #FAF5E0;
      --font-heading: 'Montserrat', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-body: 'Source Sans Pro', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --space-2xl: 48px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-pill: 25px;
      --radius-full: 50px;
      --sidebar-width: 250px;
      --header-height: 49px;
    }

    /* === RESET === */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    /* === BASE === */
    body {
      margin: 0;
      font-family: var(--font-body);
      background-color: var(--color-bg-light);
      color: var(--color-dark);
      display: grid;
      grid-template-columns: var(--sidebar-width) 1fr;
      grid-template-rows: var(--header-height) 1fr;
      min-height: 100vh;
    }

    /* === TYPOGRAPHY === */
    h1, h2 {
      font-family: var(--font-heading);
      font-weight: 700;
      margin: 0 0 var(--space-md);
    }

    h3, h4 {
      font-family: var(--font-body);
      font-weight: 700;
      margin: 0 0 var(--space-sm);
    }

    h1 { font-size: 56px; line-height: 1.2; }
    h2 { font-size: 36px; line-height: 1.3; }
    h3 { font-size: 28px; line-height: 1.3; }
    h4 { font-size: 20px; line-height: 1.15; }

    p {
      margin: 0 0 var(--space-md);
      line-height: 1.15;
    }

    /* === HEADER === */
    .header {
      position: sticky;
      top: 0;
      background-color: var(--color-white);
      height: var(--header-height);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-lg);
      border-bottom: 1px solid var(--color-border);
      grid-column: 1 / -1;
    }

    .logo {
      height: 32px;
      width: auto;
    }

    /* === ROLE TOGGLE === */
    .role-toggle {
      display: flex;
      gap: var(--space-sm);
    }

    .role-toggle button {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 700;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-pill);
      padding: 6px 18px;
      background-color: var(--color-white);
      color: var(--color-dark);
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
    }

    .role-toggle button:hover {
      border-color: var(--hc-red);
      color: var(--hc-red);
    }

    .role-toggle button.active {
      background-color: var(--hc-red);
      color: var(--color-white);
      border-color: var(--hc-red);
    }

    /* === MAIN CONTENT === */
    .main-content {
      padding: var(--space-xl);
      overflow-y: auto;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    /* === TOAST CONTAINER === */
    .toast-container {
      position: fixed;
      bottom: var(--space-lg);
      right: var(--space-lg);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    /* === SIDEBAR === */
    .sidebar {
      background-color: var(--color-dark);
      padding-top: var(--space-xl);
      overflow-y: auto;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: 12px var(--space-lg);
      color: var(--color-white);
      text-decoration: none;
      font-size: 16px;
      font-weight: 400;
      transition: color 0.2s;
      border-left: 3px solid transparent;
    }

    .nav-link:hover {
      color: var(--hc-red);
    }

    .nav-link.active {
      color: var(--hc-red);
      border-left-color: var(--hc-red);
      font-weight: 700;
    }

    .nav-link i {
      width: 20px;
      height: 20px;
    }

    /* === DASHBOARD STATS === */
    .dashboard-stats {
      display: flex;
      gap: var(--space-md);
      margin-bottom: var(--space-lg);
      flex-wrap: wrap;
    }

    .stat-card {
      background-color: var(--color-white);
      border-radius: var(--radius-lg);
      padding: var(--space-md) var(--space-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 120px;
      border: 1px solid var(--color-border);
    }

    .stat-card .stat-value {
      font-family: var(--font-heading);
      font-size: 28px;
      font-weight: 700;
      color: var(--color-dark);
    }

    .stat-card .stat-label {
      font-size: 13px;
      color: var(--color-gray);
      margin-top: var(--space-xs);
    }

    /* === DASHBOARD TOOLBAR === */
    .dashboard-toolbar {
      display: flex;
      gap: var(--space-md);
      margin-bottom: var(--space-lg);
      align-items: center;
    }

    .search-input {
      border-radius: var(--radius-full);
      padding: 10px 20px;
      border: 1px solid var(--color-border-input);
      font-size: 16px;
      font-family: var(--font-body);
      width: 300px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--hc-red);
    }

    .search-input::placeholder {
      color: var(--color-gray-light);
    }

    .view-toggle {
      display: flex;
      margin-left: auto;
    }

    .view-toggle button {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      border: 1px solid var(--color-border);
      padding: 8px 18px;
      background-color: var(--color-white);
      color: var(--color-dark);
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
    }

    .view-toggle button:first-child {
      border-radius: var(--radius-pill) 0 0 var(--radius-pill);
      border-right: none;
    }

    .view-toggle button:last-child {
      border-radius: 0 var(--radius-pill) var(--radius-pill) 0;
    }

    .view-toggle button:hover {
      border-color: var(--hc-red);
      color: var(--hc-red);
    }

    .view-toggle button.active {
      background-color: var(--hc-red);
      color: var(--color-white);
      border-color: var(--hc-red);
    }

    /* === CARDS GRID === */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: var(--space-lg);
    }

    .app-card {
      background-color: var(--color-white);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      border: 1px solid var(--color-border);
    }

    .app-card:hover {
      transform: translateY(-2px);
      border-color: var(--hc-red);
    }

    .app-card h4 {
      font-size: 18px;
      margin-bottom: var(--space-sm);
      color: var(--color-dark);
    }

    .app-card .card-owner {
      font-size: 14px;
      color: var(--color-gray);
      margin-bottom: var(--space-md);
    }

    .app-card .card-badges {
      display: flex;
      gap: var(--space-sm);
      flex-wrap: wrap;
    }

    /* === BADGES === */
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 700;
    }

    /* === APP TABLE === */
    .app-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .app-table th {
      background-color: var(--color-dark);
      color: var(--color-white);
      padding: 12px 16px;
      text-align: left;
      font-weight: 700;
      font-size: 14px;
    }

    .app-table td {
      padding: 12px 16px;
      font-size: 14px;
    }

    .app-table tr:nth-child(even) {
      background-color: var(--color-bg-warm);
    }

    .app-table tbody tr:hover {
      background-color: var(--color-border);
    }

    .app-table tbody tr {
      cursor: pointer;
      transition: background-color 0.2s;
    }

    /* === EMPTY STATE === */
    .empty-state {
      text-align: center;
      padding: var(--space-2xl);
      color: var(--color-gray);
    }

    /* === DETAIL VIEW === */
    .detail-grid {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: var(--space-md) var(--space-lg);
      max-width: 700px;
      margin-bottom: var(--space-xl);
    }

    .detail-label {
      font-weight: 700;
      color: var(--color-gray);
    }

    .detail-value {
      color: var(--color-dark);
    }

    .detail-actions {
      display: flex;
      gap: var(--space-md);
      margin-top: var(--space-xl);
      align-items: center;
    }

    .btn-primary {
      background: var(--hc-yellow);
      color: var(--color-black);
      border-radius: var(--radius-pill);
      height: 48px;
      padding: 0 32px;
      border: none;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      font-family: var(--font-body);
      transition: filter 0.2s;
    }

    .btn-primary:hover {
      filter: brightness(0.95);
    }

    .btn-secondary {
      background: transparent;
      color: var(--hc-red);
      border: none;
      text-decoration: underline;
      cursor: pointer;
      font-size: 16px;
      font-family: var(--font-body);
    }

    /* === FORM === */
    .form-container {
      max-width: 600px;
    }

    .form-group {
      margin-bottom: var(--space-lg);
    }

    .form-group label {
      display: block;
      font-weight: 700;
      margin-bottom: var(--space-sm);
      font-size: 14px;
      color: var(--color-dark);
    }

    .form-input {
      display: block;
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--color-border-input);
      border-radius: var(--radius-md);
      font-size: 16px;
      font-family: var(--font-body);
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: var(--hc-red);
    }

    textarea.form-input {
      min-height: 120px;
      resize: vertical;
    }

    .form-actions {
      display: flex;
      gap: var(--space-md);
      margin-top: var(--space-xl);
      align-items: center;
    }

    /* === TOAST === */
    .toast {
      background-color: var(--color-dark);
      color: var(--color-white);
      padding: 12px 24px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-family: var(--font-body);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.3s, transform 0.3s;
    }

    .toast.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .toast-success {
      background-color: #1B5E20;
    }

    .toast-error {
      background-color: var(--hc-red);
    }

    .toast-info {
      background-color: var(--color-navy);
    }

    /* === WIZARD === */
    .wizard-container {
      max-width: 600px;
    }

    .wizard-step-indicator {
      font-size: 14px;
      color: var(--color-gray);
      margin-bottom: var(--space-sm);
    }

    .wizard-progress {
      margin-bottom: var(--space-lg);
      display: flex;
      gap: var(--space-sm);
    }

    .progress-bar {
      height: 6px;
      background: var(--color-border);
      border-radius: 3px;
      overflow: hidden;
      flex: 1;
    }

    .progress-fill {
      height: 100%;
      background: var(--hc-red);
      transition: width 0.3s;
    }

    .wizard-question {
      font-size: 24px;
      margin-bottom: var(--space-lg);
    }

    .wizard-options {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .wizard-option {
      padding: var(--space-md) var(--space-lg);
      border: 2px solid var(--color-border);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: border-color 0.2s;
      background: var(--color-white);
    }

    .wizard-option:hover {
      border-color: var(--hc-red);
    }

    .wizard-option.selected {
      border-color: var(--hc-red);
      background-color: #FDEAEC;
    }

    .wizard-actions {
      display: flex;
      gap: var(--space-md);
      margin-top: var(--space-xl);
      align-items: center;
    }

    .wizard-result {
      padding: var(--space-xl);
      border-radius: var(--radius-lg);
      background: var(--color-white);
      border: 1px solid var(--color-border);
    }

    .wizard-result h3 {
      margin-bottom: var(--space-md);
    }

    /* === ADMIN PANEL === */
    .admin-section {
      margin-bottom: var(--space-2xl);
    }

    .admin-section h3 {
      margin-bottom: var(--space-lg);
    }

    .admin-stats {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: var(--space-md);
    }

    .admin-stat-card {
      background-color: var(--color-white);
      border-radius: 16px;
      border: 1px solid var(--color-border);
      padding: var(--space-lg);
      text-align: center;
    }

    .admin-stat-card .stat-number {
      font-size: 32px;
      font-weight: 700;
      font-family: var(--font-heading);
    }

    .admin-stat-card .stat-text {
      font-size: 13px;
      color: var(--color-gray);
      margin-top: var(--space-xs);
    }

    /* === RESPONSIVE === */
    .hamburger {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: var(--space-sm);
      color: var(--color-dark);
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      top: var(--header-height);
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.3);
      z-index: 998;
    }

    @media (max-width: 1023px) {
      body {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: fixed;
        top: var(--header-height);
        left: calc(-1 * var(--sidebar-width));
        width: var(--sidebar-width);
        height: calc(100vh - var(--header-height));
        transition: left 0.3s ease;
        z-index: 999;
      }

      .sidebar.open {
        left: 0;
      }

      .hamburger {
        display: block;
      }

      .sidebar-overlay.open {
        display: block;
      }

      .main-content {
        padding: var(--space-md);
      }

      .cards-grid {
        grid-template-columns: 1fr;
      }

      .dashboard-toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .search-input {
        width: 100%;
      }

      .view-toggle {
        margin-left: 0;
      }
    }
  </style>
</head>

    function calculateClassification(answers) {
      const total = answers.reduce((sum, score) => sum + score, 0);
      if (total <= 6) {
        return {
          classification: 'MALÁ',
          justification: `Celkové skóre ${total}/12. Aplikace má omezený počet uživatelů, nízkou datovou citlivost a minimální integrační složitost. Klasifikace MALÁ je vhodná.`
        };
      } else if (total <= 9) {
        return {
          classification: 'STŘEDNÍ',
          justification: `Celkové skóre ${total}/12. Aplikace vykazuje střední nároky na bezpečnost, dostupnost nebo integraci. Klasifikace STŘEDNÍ odpovídá jejímu profilu.`
        };
      } else {
        return {
          classification: 'VELKÁ',
          justification: `Celkové skóre ${total}/12. Aplikace je kritická pro provoz, zpracovává citlivá data a/nebo má rozsáhlou integrační síť. Klasifikace VELKÁ je oprávněná.`
        };
      }
    }

      container.innerHTML = `

          </div>
        </div>
      `;
    }

    // === NAVIGATION ===
    function navigateTo(sectionId, params = {}) {
      // Guard: unknown section
      if (!VALID_SECTIONS.includes(sectionId)) {
        sectionId = 'dashboard';
      }

      // Guard: role access — admin section requires admin role
      if (sectionId === 'admin' && state.currentRole !== 'admin') {
        sectionId = 'dashboard';
      }

      // Hide all sections
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));

      // Show target section
      document.getElementById(`section-${sectionId}`).classList.add('active');

      // Update sidebar active link
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      const targetLink = document.querySelector(`[data-section="${sectionId}"]`);
      if (targetLink) {
        targetLink.classList.add('active');
      }

      // Update state
      state.currentSection = sectionId;

      // Render section content
      switch (sectionId) {
        case 'dashboard': renderDashboard(); break;
        case 'detail': renderDetail(params.appId); break;
        case 'form': renderForm(params.appId || null); break;
        case 'wizard': renderWizardStep(state.wizardStep); break;
        case 'admin': renderAdmin(); break;
      }
    }

    // === ROLE MANAGEMENT ===
    function setRole(role) {
      state.currentRole = role;

      // Update toggle buttons
      document.querySelectorAll('.role-toggle button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.role === role);
      });

      // Show/hide admin-only elements
      document.querySelectorAll('.admin-only').forEach(el => {
        el.style.display = role === 'admin' ? '' : 'none';
      });

      // Redirect if current section is no longer accessible
      if (state.currentSection === 'admin' && role !== 'admin') {
        navigateTo('dashboard');
      }
    }

    // === SIDEBAR TOGGLE (MOBILE) ===
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.toggle('open');
      if (overlay) overlay.classList.toggle('open');
    }

    function closeSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.remove('open');
      if (overlay) overlay.classList.remove('open');
    }

    // === TOAST NOTIFICATIONS ===
    function showToast(message, type = 'success', duration = 3000) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = message;
      container.appendChild(toast);

      // Trigger entrance animation
      requestAnimationFrame(() => toast.classList.add('visible'));

      // Auto-remove
      setTimeout(() => {
        toast.classList.remove('visible');
        setTimeout(() => toast.remove(), 300);
      }, duration);
    }

    // === INITIALIZATION ===
    function init() {
      // Wire nav links
      document.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          navigateTo(link.dataset.section);
          closeSidebar();
        });
      });

      // Wire role toggle buttons
      document.querySelectorAll('.role-toggle button').forEach(btn => {
        btn.addEventListener('click', () => {
          setRole(btn.dataset.role);
        });
      });

      // Initialize Lucide icons
      lucide.createIcons();

      // Set initial state
      setRole('user');
      navigateTo('dashboard');
    }

    // Start the app
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
