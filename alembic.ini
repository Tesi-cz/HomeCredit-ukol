# REGINA - konfigurace Alembic
#
# Pripojovaci retezec se ZAMERNE nezapisuje sem. Cte se z promenne prostredi
# DATABASE_URL pres env.py (design.md 6.4, R12.4). Neni tu tedy zadne tajemstvi
# a nastaveni databaze zustava na jednom miste - v konfiguraci.
#
# Migrace se aplikuji automaticky pri startu kontejneru pred spustenim serveru
# (entrypoint.sh: `alembic upgrade head`), bez rucniho kroku (R12.8).
#
# Poznamka ke kodovani: tento soubor je zamerne ciste ASCII. Alembic cte
# alembic.ini pres configparser s kodovanim podle locale operacniho systemu,
# takze diakritika by na Windows (cp1250) rozbila cteni. Ceske komentare
# s diakritikou jsou v env.py a v migracnich skriptech, ktere se ctou jako UTF-8.

[alembic]
# Skripty revizi a env.py lezi u datove vrstvy, ne v koreni repozitare.
script_location = src/regina/db/migrations

# Cesty k revizim se oddeluji mezerou.
version_path_separator = space

# URL zde neni. Nastavuje ho env.py z DATABASE_URL.
# sqlalchemy.url =

[post_write_hooks]
# Bez automatickych hooku. Formatovani resi ruff mimo Alembic.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
